monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - audit       # Separate channel for upload API request audit trail

    handlers:
        # Audit log — always on, rotating daily, 30-day retention
        audit_file:
            type: rotating_file
            path: '%kernel.logs_dir%/audit.log'
            level: info
            max_files: 30
            channels: [audit]
            formatter: monolog.formatter.json

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: '%kernel.logs_dir%/app.log'
                level: debug
                max_files: 30
                channels: ['!event', '!audit']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console', '!audit']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event', '!audit']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!deprecation', '!audit']
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!audit']
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
