[www]
; Tuned for concurrent chunked uploads.
;
; At peak load (100 VUs × 3 parallel chunks) up to 300 chunk requests can be
; in flight simultaneously. Each chunk request holds a worker for ~90ms while
; writing 1 MB to disk and flushing to MySQL. With the default pm.max_children=5
; most requests queue at Nginx and eventually hit the client timeout.
;
; 50 workers handles the baseline scenario (10 VUs) without any queuing and
; sustains the ramp-to-100 scenario within acceptable latency bounds.
; Each Symfony worker uses ~40-60 MB RSS; 50 workers ≈ 2-3 GB peak.
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 30
